<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <title>TODO + Delegation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 640px;
            margin: 24px auto;
        }

        #controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        #taskInput {
            flex: 1;
            padding: 8px;
        }

        #addBtn {
            padding: 8px 14px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 6px 0;
        }

        .title {
            flex: 1;
        }

        .del {
            padding: 4px 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Список завдань</h2>

    <div id="controls">
        <input id="taskInput" type="text" placeholder="Нове завдання..." />
        <button id="addBtn">Додати</button>
    </div>

    <ul id="todoList">
        <li>
            <span class="title">Завдання 1</span>
            <button class="del" data-action="delete">Видалити</button>
        </li>
        <li>
            <span class="title">Завдання 2</span>
            <button class="del" data-action="delete">Видалити</button>
        </li>
        <li>
            <span class="title">Завдання 3</span>
            <button class="del" data-action="delete">Видалити</button>
        </li>
    </ul>

    <script src="task12.3.js" defer></script>
</body>

</html>
