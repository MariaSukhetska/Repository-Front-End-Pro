<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8">
    <title>Випадкове зображення</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        img {
            max-width: 320px;
            display: block;
            margin: 16px auto;
            border: 1px solid #444;
        }

        button {
            display: block;
            margin: 8px auto;
            padding: 8px 16px;
        }

        #info {
            text-align: center;
            font-size: 14px;
            color: #555;
        }

        #error {
            text-align: center;
            color: #b00020;
        }
    </style>
</head>

<body>
    <h2 style="text-align:center;">Випадкове зображення</h2>
    <div id="info"></div>
    <img id="randomImage" alt="Random picture" />
    <div id="error"></div>
    <button id="newImageBtn">Показати нове зображення</button>

    <script>
        const img = document.getElementById("randomImage");
        const button = document.getElementById("newImageBtn");
        const info = document.getElementById("info");
        const errorBox = document.getElementById("error");

        function showRandomImage() {
            errorBox.textContent = ""; 
            const number = Math.floor(Math.random() * 9) + 1; 
            const src = `images/${number}.jpg`;
            info.textContent = `Пробую завантажити: ${src}`;
            console.log("Loading:", src);

            img.onerror = () => {
                errorBox.textContent = `Помилка завантаження: ${src}. Перевір назву файлу та шлях.`;
                console.error("Image load error:", src);
            };

            img.onload = () => {
                errorBox.textContent = "";
            };

            img.src = src;
        }

        showRandomImage();

        button.addEventListener("click", showRandomImage);
    </script>
</body>

</html>
