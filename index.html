<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <title>Форма з валідацією</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 640px;
            margin: 24px auto;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        .error {
            color: #b00020;
            font-size: 12px;
            margin-top: -8px;
            margin-bottom: 8px;
        }

        button {
            width: fit-content;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>We would like to help you</h2>

    <form id="contactForm" novalidate>
        <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" />
            <div id="err-name" class="error"></div>
        </div>

        <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4"></textarea>
            <div id="err-message" class="error"></div>
        </div>

        <div>
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" placeholder="+380XXXXXXXXX" />
            <div id="err-phone" class="error"></div>
        </div>

        <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" />
            <div id="err-email" class="error"></div>
        </div>

        <button type="submit">Send message</button>
    </form>

    <script src="task13.1.js" defer></script>
</body>

</html>
